AWSTemplateFormatVersion: '2010-09-09'
Description: Development S3 bucket for MavChat attachments.

Parameters:
  AppOrigin:
    Type: String
    Default: http://localhost:8000

Resources:
  MavChatDevAttachmentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AppOrigin
            AllowedMethods: [GET, PUT, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000

  MavChatDevS3User:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: MavChatDevAttachmentAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${MavChatDevAttachmentsBucket.Arn}/chat-attachments/*'

  MavChatDevAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref MavChatDevS3User
      Status: Active

Outputs:
  BucketName:
    Value: !Ref MavChatDevAttachmentsBucket
  BucketArn:
    Value: !GetAtt MavChatDevAttachmentsBucket.Arn
  Region:
    Value: !Ref AWS::Region
  AccessKeyId:
    Value: !Ref MavChatDevAccessKey
  SecretAccessKey:
    Value: !GetAtt MavChatDevAccessKey.SecretAccessKey
